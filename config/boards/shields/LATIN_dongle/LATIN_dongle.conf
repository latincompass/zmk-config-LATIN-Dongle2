# LATIN Dongle Configuration
# This configures the USB dongle to act as a receiver for the LATIN keyboard

# Enable USB (dongle connects to host via USB)
CONFIG_ZMK_USB=y

# Enable BLE for split communication (dongle uses BLE to talk to keyboard)
CONFIG_ZMK_BLE=y

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y

# Configure as central (dongle/receiver)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Number of peripherals (keyboards) that can connect to this central
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# USB HID settings
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_USB_BOOT=y

# Disable unnecessary features
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_POINTING=n

# RGB LED Widget for connection status indicator
CONFIG_RGBLED_WIDGET=y
# Blue - connected
CONFIG_RGBLED_WIDGET_CONN_COLOR_CONNECTED=4
# Yellow - advertising
CONFIG_RGBLED_WIDGET_CONN_COLOR_ADVERTISING=3
# Red - disconnected
CONFIG_RGBLED_WIDGET_CONN_COLOR_DISCONNECTED=1

# Enable logging for debugging (optional)
# CONFIG_ZMK_USB_LOGGING=y

# Power and Connection Optimization
# Increase BLE transmission power for better stability and range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sleep mode configuration
# Disable sleep mode to maintain continuous connection (like Charybdis reference)
CONFIG_ZMK_SLEEP=n
