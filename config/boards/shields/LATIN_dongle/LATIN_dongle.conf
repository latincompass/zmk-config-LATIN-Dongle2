# LATIN Dongle Configuration
# This configures the USB dongle to act as a receiver for the LATIN keyboard

# Enable USB (dongle connects to host via USB)
CONFIG_ZMK_USB=y
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y

# Disable BLE as a keyboard output (we're using BLE only for split communication)
CONFIG_ZMK_BLE=n

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y

# Configure as central (dongle/receiver)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

# Number of peripherals (keyboards) that can connect to this central
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# BLE settings for split communication
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# USB HID settings
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_USB_BOOT=y

# Disable unnecessary features
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_BATTERY_REPORTING=n

# Enable logging for debugging (optional)
# CONFIG_ZMK_USB_LOGGING=y
