# LATIN Keyboard Configuration
# This configures the keyboard as a peripheral that connects to the dongle (central)

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y

# Configure as peripheral (keyboard connects to dongle)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Enable BLE for split communication
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Disable USB (this is a wireless peripheral)
CONFIG_ZMK_USB=n
CONFIG_USB_DEVICE_STACK=n

# BLE settings for split communication
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# HID settings
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Enable battery reporting (optional for wireless keyboard)
CONFIG_ZMK_BATTERY_REPORTING=y

# Optional features
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# Enable logging for debugging (optional)
# CONFIG_ZMK_USB_LOGGING=y

# Power and Connection Optimization
# Increase BLE transmission power for better stability and range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sleep mode configuration
# Enable sleep mode to save power when idle
CONFIG_ZMK_SLEEP=y
# Idle timeout before entering sleep (in milliseconds, default 15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
